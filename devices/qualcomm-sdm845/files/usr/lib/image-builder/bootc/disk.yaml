mount_configuration: "units"
partition_table:
  type: "gpt"
  partitions:
    - size: "1 MiB"
      bootable: true
      # BIOS boot partition, required because of a bootupd issue
      type: "21686148-6449-6e6F-744e-656564454649"
    - size: "256 MiB"
      type: "C12A7328-F81F-11D2-BA4B-00A0C93EC93B" # EFI system partition
      payload_type: "filesystem"
      payload:
        type: "vfat"
        mountpoint: "/boot/efi"
        label: "EFI"
        fstab_options: "umask=0077,shortname=winnt"
        fstab_freq: 0
        fstab_passno: 2
    - size: "20 GiB"
      type: "0FC63DAF-8483-4772-8E79-3D69D8477DE4" # Linux Filesystem
      payload_type: "btrfs"
      payload:
        subvolumes:
          - name: "root"
            mountpoint: "/"
          - name: "home"
            mountpoint: "/home"
          - name: "var"
            mountpoint: "/var"
